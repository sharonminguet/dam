<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ejemplo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f9f9f9;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Formulario de Registro</h1>
    </header>
    <main>
        <form>
            <label for="name">Introduce tu nombre:</label>
            <input type="text" id="name" name="name" value="hola">
            
            <label for="city">Selecciona una ciudad:</label>
            <select id="city" name="city">
                <option value="valencia">Valencia</option>
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
            </select>
            
            <label for="comments">Comentarios:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>
            
            <button type="button">Púlsame</button>
            
            <fieldset>
                <legend>Personalia:</legend>
                <label for="fname">Nombre:</label>
                <input type="text" id="fname" name="fname" value="John">
                
                <label for="lname">Apellido:</label>
                <input type="text" id="lname" name="lname" value="Doe">
                
                <input type="submit" value="Enviar">
            </fieldset>

            <label for="browsers">Selecciona un navegador:</label>
            <input list="browsers" id="browsersInput" name="browsers">
            <datalist id="browsers">
                <option value="Edge">
                <option value="Firefox">
                <option value="Chrome">
                <option value="Opera">
                <option value="Safari">
            </datalist>
        </form>
    </main>
</body>
</html>
